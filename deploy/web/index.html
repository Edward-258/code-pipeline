<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>mini-pipeline</title>
<style>
  :root { --bg:#141821; --panel:#1c2230; --line:#2a3245; --fg:#d7dde8; --dim:#7c8699;
          --ok:#4caf7d; --bad:#e06c60; --run:#58a6ff; --pause:#d19a66; --skip:#555f70; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 "SF Mono",Consolas,monospace; }
  header { display:flex; align-items:center; gap:16px; padding:10px 20px;
           border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; margin:0; color:var(--run); }
  nav button { background:none; border:1px solid var(--line); color:var(--dim);
               padding:5px 14px; border-radius:6px; cursor:pointer; margin-right:6px; font:inherit; }
  nav button.on { color:var(--fg); border-color:var(--run); }
  main { padding:16px 20px; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:6px 10px; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:normal; }
  tr.click { cursor:pointer; } tr.click:hover { background:#222a3b; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px;
           padding:14px; margin-bottom:14px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  input,select,textarea { background:#11151f; color:var(--fg); border:1px solid var(--line);
          border-radius:5px; padding:5px 8px; font:inherit; }
  textarea { width:100%; min-height:180px; }
  button.act { background:#24304a; color:var(--fg); border:1px solid #3a4a6e; border-radius:5px;
               padding:4px 12px; cursor:pointer; font:inherit; }
  button.act:hover { background:#2e3d5f; }
  button.danger { border-color:#6e3a3a; }
  .st { padding:1px 8px; border-radius:9px; font-size:12px; }
  .st.passed{background:#173828;color:var(--ok)} .st.failed{background:#3a1c1c;color:var(--bad)}
  .st.running,.st.queued{background:#1a2c45;color:var(--run)} .st.pause{background:#3a2c1a;color:var(--pause)}
  .st.skipped,.st.created,.st.cancelled{background:#232936;color:var(--skip)}
  pre { background:#11151f; border:1px solid var(--line); border-radius:6px; padding:10px;
        overflow:auto; max-height:420px; font-size:12px; white-space:pre-wrap; }
  .tree ul { list-style:none; padding-left:18px; margin:4px 0; }
  .tree>ul { padding-left:0; }
  .tree li { margin:2px 0; }
  .muted { color:var(--dim); }
  .badge { border:1px solid var(--line); border-radius:5px; padding:1px 7px; font-size:12px; }
  a { color:var(--run); }
</style>
</head>
<body>
<header>
  <h1>mini-pipeline</h1>
  <nav id="tabs">
    <button data-t="wf" class="on">工作流</button>
    <button data-t="task">任务</button>
    <button data-t="env">环境</button>
    <button data-t="notify">通知</button>
    <button data-t="cron">定时</button>
  </nav>
</header>
<main id="main"></main>

<script>
"use strict";
const $ = sel => document.querySelector(sel);
const api = (path, opt) => fetch("/api" + path, opt).then(async r => {
  const txt = await r.text();
  let body; try { body = JSON.parse(txt); } catch { body = txt; }
  if (!r.ok) throw new Error((body && body.error) || r.status);
  return body;
});
const post = (path, body) => api(path, {method:"POST", headers:{"Content-Type":"application/json"},
                                        body: body === undefined ? "{}" : JSON.stringify(body)});
const del = path => api(path, {method:"DELETE"});
const h = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const stTag = s => `<span class="st ${s}">${s}</span>`;
const ts = u => u ? new Date(u*1000).toLocaleTimeString() : "-";

let tab = "wf", timer = null;
let curWf = null, curTask = null, taskPage = 1, taskFilter = {status:"", creator:""};

document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => {
  tab = b.dataset.t;
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
  render();
});

function auto(fn, ms=2000) { // 活页 2s 轮询
  clearInterval(timer);
  fn();
  timer = setInterval(fn, ms);
}

/* ---------- 工作流 ---------- */
function renderWf() {
  api("/workflows").then(list => {
    $("#main").innerHTML = `
      <div class="panel">
        <div class="row"><b>工作流列表</b>
          <span class="muted">（点击行看详情 / 编辑；改完 JSON 保存 = 删除重建，任务档案不受影响）</span></div>
        <table><tr><th>name</th><th>stages</th><th>操作</th></tr>
        ${list.map(w => `<tr class="click" data-w="${h(w.name)}">
            <td>${h(w.name)}</td>
            <td class="muted">${(w.stages||[]).map(s=>h(s.name)).join(" → ")}</td>
            <td><button class="act" data-run="${h(w.name)}">run</button>
                <button class="act danger" data-del="${h(w.name)}">delete</button></td>
          </tr>`).join("")}
        </table>
      </div>
      <div class="panel" id="wfDetail"></div>`;
    $("#main").querySelectorAll("tr.click").forEach(tr => tr.onclick = e => {
      if (e.target.dataset.run || e.target.dataset.del) return;
      openWf(tr.dataset.w);
    });
    $("#main").querySelectorAll("[data-run]").forEach(b => b.onclick = async e => {
      e.stopPropagation();
      try { const t = await post(`/workflows/${b.dataset.run}/run`); alert(`已入队：${t.id}`); }
      catch (err) { alert(err.message); }
    });
    $("#main").querySelectorAll("[data-del]").forEach(b => b.onclick = async e => {
      e.stopPropagation();
      if (!confirm(`删除工作流 ${b.dataset.del}？（任务档案保留）`)) return;
      await del(`/workflows/${b.dataset.del}`); renderWf();
    });
    if (curWf) openWf(curWf.name, true);
  }).catch(e => $("#main").innerHTML = `<div class="panel">${e.message}</div>`);
}

async function openWf(name, keep) {
  const w = await api(`/workflows/${name}`);
  curWf = w;
  const d = $("#wfDetail"); if (!d) return;
  d.innerHTML = `
    <div class="row"><b>${h(w.name)}</b>
      <button class="act" id="wfSave">保存（删除重建）</button>
      <span class="muted">webhooks: ${(w.webhooks||[]).map(x=>`${h(x.repo)}@${h(x.branch)}`).join(", ") || "无"}</span>
    </div>
    <textarea id="wfJson">${h(JSON.stringify(w, null, 2))}</textarea>`;
  $("#wfSave").onclick = async () => {
    let body; try { body = JSON.parse($("#wfJson").value); } catch (e) { return alert("JSON 不合法：" + e.message); }
    try {
      await del(`/workflows/${name}`);
      body.name = name;
      await post("/workflows", body);
      alert("已保存"); curWf = null; renderWf();
    } catch (err) { alert(err.message); renderWf(); }
  };
  if (!keep) d.scrollIntoView({behavior:"smooth"});
}

/* ---------- 任务 ---------- */
function renderTask() {
  api("/workflows").then(list => {
    const names = list.map(w => w.name);
    if (!curWf || !names.includes(curWf)) curWf = names[0];
    $("#main").innerHTML = `
      <div class="panel">
        <div class="row">
          <b>任务列表</b>
          <select id="fWf">${names.map(n => `<option ${n===curWf?"selected":""}>${h(n)}</option>`).join("")}</select>
          <select id="fSt"><option value="">全部状态</option>${["queued","running","passed","failed","cancelled","pause"]
            .map(s => `<option ${s===taskFilter.status?"selected":""}>${s}</option>`).join("")}</select>
          <input id="fCr" placeholder="creator" value="${h(taskFilter.creator)}" size="10">
          <button class="act" id="fGo">查询</button>
          <span class="muted">每页 20 · 2s 自动刷新</span>
        </div>
        <table><tr><th>id</th><th>状态</th><th>creator</th><th>创建时间</th></tr>
          <tbody id="taskRows"></tbody></table>
        <div class="row" style="margin-top:8px">
          <button class="act" id="pPrev">上一页</button>
          <span id="pInfo" class="muted"></span>
          <button class="act" id="pNext">下一页</button>
        </div>
      </div>
      <div class="panel" id="taskDetail"></div>`;
    $("#fGo").onclick = () => { taskFilter.status = $("#fSt").value; taskFilter.creator = $("#fCr").value; taskPage = 1; loadTasks(); };
    $("#fWf").onchange = e => { curWf = e.target.value; taskPage = 1; loadTasks(); };
    $("#pPrev").onclick = () => { if (taskPage > 1) { taskPage--; loadTasks(); } };
    $("#pNext").onclick = () => { taskPage++; loadTasks().catch(() => { taskPage--; loadTasks(); }); };
    loadTasks();
  });
}

async function loadTasks() {
  const q = new URLSearchParams({page: taskPage, size: 20,
    ...(taskFilter.status && {status: taskFilter.status}),
    ...(taskFilter.creator && {creator: taskFilter.creator})});
  const r = await api(`/tasks/${curWf}?` + q);
  $("#taskRows").innerHTML = (r.items || []).map(t => `
    <tr class="click" data-id="${t.task_id}">
      <td>${h(t.id)}</td><td>${stTag(t.status)}</td><td>${h(t.creator)}</td><td>${ts(t.created_at?.unix ?? t.created_at)}</td>
    </tr>`).join("") || `<tr><td colspan="4" class="muted">无任务</td></tr>`;
  $("#pInfo").textContent = `第 ${r.page} 页 / 共 ${r.total} 条`;
  $("#taskRows").querySelectorAll("tr.click").forEach(tr => tr.onclick = () => openTask(+tr.dataset.id));
  if (curTask && curTask.wf === curWf) openTask(curTask.id, true);
}

async function openTask(id, keep) {
  const t = await api(`/tasks/${curWf}/${id}`);
  curTask = {wf: curWf, id};
  const d = $("#taskDetail"); if (!d) return;
  const tree = (t.stages || []).map(s => `
    <li>${stTag(s.status)} <b>${h(s.name)}</b>
      ${s.manual_exec && s.manual_exec.enabled ? `<span class="badge">闸门 ${s.manual_exec.executed ? "已放行" : "等审批"}${s.manual_exec.policy ? " · " + h(s.manual_exec.policy) : ""}</span>` : ""}
      <ul>${(s.jobs || []).map(j => `
        <li>${stTag(j.status)} <b>${h(j.name)}</b> <span class="muted">${h(j.job_type)}${j.retry ? ` · retry=${j.retry}` : ""}</span>
          ${j.outputs && Object.keys(j.outputs).length ? `<span class="badge">outputs: ${h(JSON.stringify(j.outputs))}</span>` : ""}
          <ul>${(j.steps || []).map(sp => `
            <li>${stTag(sp.status)} <b>${h(sp.name)}</b> <span class="muted">${h(sp.type)}</span>
              ${sp.test_result ? `<span class="badge">tests=${sp.test_result.tests} failures=${sp.test_result.failures} time=${sp.test_result.time}s</span>` : ""}
              ${sp.error ? `<span class="st failed">${h(sp.error)}</span>` : ""}
              <div><a href="#" data-log="${h(s.name)}|${h(j.name)}|${h(sp.name)}">日志</a>
                   <a href="/api/tasks/${h(curWf)}/${id}/artifact/${h(sp.name)}">artifact</a></div>
              <pre id="log-${h(s.name)}-${h(j.name)}-${h(sp.name)}" style="display:none"></pre>
          `).join("")}</ul>
        </li>`).join("")}</ul>
    </li>`).join("")}`;
  d.innerHTML = `
    <div class="row"><b>${h(t.id)}</b> ${stTag(t.status)}
      ${t.error ? `<span class="st failed">${h(t.error)}</span>` : ""}
      <span class="muted">${ts(t.start_time)} → ${ts(t.end_time)}</span>
      <button class="act" data-a="cancel">cancel</button>
      <button class="act" data-a="retry">retry</button>
      <button class="act" data-a="clone">clone</button>
    </div>
    ${t.status === "pause" ? `<div class="row">
        <input id="apWho" placeholder="审批人（自由文本）" size="14">
        <input id="apNote" placeholder="意见" size="20">
        <button class="act" id="apGo">approve</button>
        <button class="act" id="rlGo">release（老端点）</button></div>` : ""}
    <div class="tree"><ul>${tree}</ul></div>`;
  d.querySelectorAll("[data-a]").forEach(b => b.onclick = async () => {
    try {
      const a = b.dataset.a;
      if (a === "cancel") await del(`/tasks/${curWf}/${id}`);
      if (a === "retry") await post(`/tasks/${curWf}/${id}/retry`);
      if (a === "clone") await post(`/tasks/${curWf}/${id}/clone`);
      openTask(id, true);
    } catch (err) { alert(err.message); }
  });
  const apGo = $("#apGo");
  if (apGo) apGo.onclick = async () => {
    try { const r = await post(`/tasks/${curWf}/${id}/approve`,
        {approver: $("#apWho").value || "web", comment: $("#apNote").value});
      alert(r.satisfied ? "已满足策略，续跑中" : `已记录（${r.approvals} 条，策略 ${r.policy}）`);
    } catch (err) { alert(err.message); }
  };
  const rlGo = $("#rlGo");
  if (rlGo) rlGo.onclick = async () => {
    const stage = (t.stages || []).find(s => s.status === "pause");
    if (!stage) return alert("没有 pause 的 stage");
    try { await post(`/tasks/${curWf}/${id}/stages/${stage.name}/release`); } catch (err) { alert(err.message); }
  };
  d.querySelectorAll("[data-log]").forEach(a => a.onclick = e => {
    e.preventDefault();
    const [s, j, sp] = a.dataset.log.split("|");
    const pre = $(`#log-${CSS.escape(s)}-${CSS.escape(j)}-${CSS.escape(sp)}`);
    if (pre.style.display === "none") {
      fetch(`/api/tasks/${curWf}/${id}/log?stage=${encodeURIComponent(s)}&job=${encodeURIComponent(j)}&step=${encodeURIComponent(sp)}`)
        .then(r => r.text()).then(txt => { pre.textContent = txt || "(空)"; pre.style.display = "block"; });
    } else pre.style.display = "none";
  });
  if (!keep) d.scrollIntoView({behavior:"smooth"});
}

/* ---------- 环境 / 通知 / 定时 ---------- */
function renderEnv() {
  api("/envs").then(list => {
    $("#main").innerHTML = `
      <div class="panel"><b>部署目标环境</b>（env = namespace 映射，deploy job 的靶标）</div>
      <div class="panel"><table><tr><th>name</th><th>namespace</th><th>desc</th><th></th></tr>
        ${list.map(e => `<tr><td>${h(e.name)}</td><td>${h(e.namespace)}</td><td class="muted">${h(e.desc)}</td>
          <td><button class="act danger" data-del="${h(e.name)}">del</button></td></tr>`).join("")}</table></div>
      <div class="panel"><div class="row">
        <input id="eName" placeholder="name" size="10"><input id="eNs" placeholder="namespace" size="14">
        <input id="eDesc" placeholder="desc" size="16"><button class="act" id="eAdd">创建</button></div></div>`;
    bindDel("/envs/", renderEnv);
    $("#eAdd").onclick = async () => {
      try { await post("/envs", {name: $("#eName").value, namespace: $("#eNs").value, desc: $("#eDesc").value}); renderEnv(); }
      catch (err) { alert(err.message); }
    };
  });
}

function renderNotify() {
  api("/notifies").then(list => {
    $("#main").innerHTML = `
      <div class="panel"><b>IM 通知</b>（任务终态推送，飞书/钉钉机器人）</div>
      <div class="panel"><table><tr><th>name</th><th>type</th><th>webhook</th><th>enabled</th><th></th></tr>
        ${list.map(n => `<tr><td>${h(n.name)}</td><td>${h(n.type)}</td><td class="muted">${h(n.webhook_url)}</td><td>${n.enabled}</td>
          <td><button class="act danger" data-del="${h(n.name)}">del</button></td></tr>`).join("")}</table></div>
      <div class="panel"><div class="row">
        <input id="nName" placeholder="name" size="8">
        <select id="nType"><option>feishu</option><option>dingtalk</option></select>
        <input id="nUrl" placeholder="webhook url" size="34">
        <input id="nSec" placeholder="secret(可选)" size="10">
        <label><input type="checkbox" id="nEn" checked>enabled</label>
        <button class="act" id="nAdd">创建</button></div></div>`;
    bindDel("/notifies/", renderNotify);
    $("#nAdd").onclick = async () => {
      try { await post("/notifies", {name: $("#nName").value, type: $("#nType").value,
        webhook_url: $("#nUrl").value, secret: $("#nSec").value, enabled: $("#nEn").checked}); renderNotify(); }
      catch (err) { alert(err.message); }
    };
  });
}

function renderCron() {
  api("/crons").then(list => {
    $("#main").innerHTML = `
      <div class="panel"><b>定时触发</b>（5 段 crontab：分 时 日 月 周，整分钟对齐调度）</div>
      <div class="panel"><table><tr><th>name</th><th>workflow</th><th>crontab</th><th>enabled</th><th></th></tr>
        ${list.map(c => `<tr><td>${h(c.name)}</td><td>${h(c.workflow_name)}</td><td class="muted">${h(c.crontab)}</td><td>${c.enabled}</td>
          <td><button class="act" data-fire="${h(c.name)}">fire</button>
              <button class="act danger" data-del="${h(c.name)}">del</button></td></tr>`).join("")}</table></div>
      <div class="panel"><div class="row">
        <input id="cName" placeholder="name" size="10"><input id="cWf" placeholder="workflow" size="12">
        <input id="cExpr" placeholder="*/5 * * * *" size="12">
        <label><input type="checkbox" id="cEn" checked>enabled</label>
        <button class="act" id="cAdd">创建</button></div></div>`;
    bindDel("/crons/", renderCron);
    $("#main").querySelectorAll("[data-fire]").forEach(b => b.onclick = async () => {
      try { const t = await post(`/crons/${b.dataset.fire}/fire`); alert(`已触发：${t.id}`); }
      catch (err) { alert(err.message); }
    });
    $("#cAdd").onclick = async () => {
      try { await post("/crons", {name: $("#cName").value, workflow_name: $("#cWf").value,
        crontab: $("#cExpr").value, enabled: $("#cEn").checked}); renderCron(); }
      catch (err) { alert(err.message); }
    };
  });
}

function bindDel(prefix, refresh) {
  $("#main").querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if (!confirm("删除 " + b.dataset.del + "？")) return;
    try { await del(prefix + b.dataset.del); refresh(); } catch (err) { alert(err.message); }
  });
}

/* ---------- 入口 ---------- */
const renders = {wf: renderWf, task: renderTask, env: renderEnv, notify: renderNotify, cron: renderCron};
function render() { renders[tab](); }
render();
</script>
</body>
</html>
