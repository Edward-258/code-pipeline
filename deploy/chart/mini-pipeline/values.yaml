# 对齐 Zadig chart 的组织方式：
#   tags.*                —— 内置组件开关（对照 Zadig tags.mongodb）
#   connections.*         —— 连接串参数化（对照 Zadig connections.mongodb.connectionString）
#   mongo.persistence.existingClaim —— 继承既有 PVC（对照 Zadig mongodb.persistence.existingClaim）

tags:
  engine: true    # 引擎本体。镜像需先推入内置 registry（见 deploy/README 或 AGENTS.md）
  mongo: true     # 内置 MongoDB；false 时必须给 connections.mongo.uri
  registry: true  # registry:2 七件套（本体+UI+双 ingress+PVC）：2026-11-07 管理权从 ArgoCD 收回本 chart（§9.21）
  web: true       # React 前端 + nginx 反代 Pod（统一入口承接者，2026-11-06）；false 时 ingress 直连引擎

connections:
  mongo:
    uri: ""       # 留空 = 自动拼内置 mongo 的集群内 DNS 连接串（见 _helpers.tpl）

image:
  repo: crpi-28fqgwft325ylccc-vpc.cn-heyuan.personal.cr.aliyuncs.com/codepipeline-learning/mini-pipeline  # ACR 个人版(河源)独立实例：VPC 端点走内网免公网流量（host 必须与 acr.registry 一致）
  tag: "0.7.2"  # 跟随当前引擎版本（此前停在 0.2.1 化石——ACR 迁移后再没动过，一直靠 --set 覆盖）
  pullPolicy: Always                  # 开发期同 tag 反复推镜像，必须每次重拉；走内网 VPC 端点，代价可忽略

# 步骤执行器宿体镜像（docker/runner.Dockerfile）：git/docker_build/archive 步骤的默认 Job 容器。
# 0.2.0 起大满贯：alpine + git/docker-cli/curl + golang 工具链 + make/jq——自动档通吃构建类
# job，免"现场选镜像"（哲学分叉：Zadig 是一组系统镜像，我们是单 runner 全能）。
# 引擎运行时创建的 K8s Job 用它，并自带 acr-credential 拉取凭证（不继承引擎 Deployment）。
# 推送：deploy/build-runner.sh（公网端点，同仓同名）。升 runner tag 只改这里，不用重编引擎。
runner:
  image: crpi-28fqgwft325ylccc-vpc.cn-heyuan.personal.cr.aliyuncs.com/codepipeline-learning/pipeline-runner:0.2.0

# 引擎镜像拉取凭证（templates/secret.yaml 由 acr.username/password 生成；username 为空则不渲染）
imagePullSecrets:
  - name: acr-credential

acr:
  # 阿里云 ACR 个人版"独立实例"形态（cn-heyuan，域名带 crpi- 前缀；老共享域名 registry.cn-heyuan 不认本实例，会报 Forbidden Host）。
  # 集群拉取走 VPC 端点（-vpc 后缀，免公网流量）；推送侧（本地/节点）用公网端点，同仓同名。
  registry: crpi-28fqgwft325ylccc-vpc.cn-heyuan.personal.cr.aliyuncs.com
  username: "nick9188231182"  # 控制台"访问凭证"页显示的用户名
  password: "Zhongshikun@123" # 固定密码（学习版明文姿态与 mongo 同档）

service:
  port: 8080

# 前端镜像（React+nginx 多阶段构建，docker/web.Dockerfile）：推送走 deploy/build-web.sh
# （公网端点），此处指 VPC 端点（集群内网拉取，与 image.repo 同实例同款套路）
web:
  image: crpi-28fqgwft325ylccc-vpc.cn-heyuan.personal.cr.aliyuncs.com/codepipeline-learning/mini-pipeline-web:0.1.5

ingress:
  enabled: true
  host: pipeline.47.113.177.198.nip.io  # 复用集群现成的 nip.io 入口链路（同 argocd 的用法）

serviceAccount:
  name: pipeline-engine  # 引擎创建/轮询/清理 K8s Job 所用的身份

mongo:
  rootPassword: mini-pipeline-2026
  persistence:
    existingClaim: mongo-data  # ⭐ 继承 M0 时期 kubectl apply 留下的 PVC，数据无感迁移；置空则按 size 新建
    size: 5Gi

registry:
  # docker_build 步骤的产物仓库（七件套定义在 templates/registry.yaml）。名字/端口/selector
  # 是硬契约：节点 docker push 127.0.0.1:30500 与 kubelet localhost:5000 mirror 全指着它
  image: registry:2
  nodePort: 30500   # 仅内网使用：安全组不对公网放行；节点间走同组内网互通规则
  ingress:
    host: registry.47.113.177.198.nip.io     # 本机 Docker Desktop 直连（daemon.json 加 insecure-registries）
  ui:
    image: joxit/docker-registry-ui:2
    title: mini-pipeline Registry
    ingress:
      host: registry-ui.47.113.177.198.nip.io
  persistence:
    existingClaim: registry-data  # ⭐ 认领存量 PVC（local-path，节点绑定 worker-1）；置空则按 size/storageClass 新建
    size: 5Gi
    storageClass: local-path

resources:
  engine: {}
  web: {}
  mongo:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
