{{- if .Values.tags.registry }}
# 内置 registry:2 —— M5 之前的镜像分发通道
#
# 暴露设计（公网零新端口）：
#   push 侧：在任一节点上 docker push 127.0.0.1:30500/...（本机回环 HTTP registry 免配置）
#   pull 侧：各节点 /etc/rancher/k3s/registries.yaml 把 "localhost:5000" mirror 到 http://127.0.0.1:30500
#   镜像名两边一致（registry 存储时剥离 host 前缀），kubelet 无感知
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
        - name: registry
          image: {{ .Values.registry.image }}
          env:
            - name: REGISTRY_HTTP_ADDR
              value: ":5000"
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"   # 方便学习期清理
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
          readinessProbe:
            httpGet:
              path: /v2/
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry-data
---
# NodePort 30500 只走内网：安全组不对公网放行；
# 节点间流量由安全组已有的同组互通规则（System created rule -1/-1）覆盖
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: {{ .Release.Namespace }}
spec:
  type: NodePort
  selector:
    app: registry
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: {{ .Values.registry.nodePort }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.registry.persistence.size }}
{{- end }}
