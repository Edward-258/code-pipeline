{{- if and .Values.tags.engine .Values.acr.username }}
# ACR 个人版私有仓库拉取凭证（仅引擎镜像用；dockerconfigjson 的 auths 按镜像 host 匹配，
# 所以 host 必须与 image.repo 的 registry 前缀一致 = acr.registry）
apiVersion: v1
kind: Secret
metadata:
  name: {{ (index .Values.imagePullSecrets 0).name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: mini-pipeline
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ dict "auths" (dict .Values.acr.registry (dict "auth" (b64enc (printf "%s:%s" .Values.acr.username .Values.acr.password)))) | toJson | b64enc | quote }}
{{- end }}
